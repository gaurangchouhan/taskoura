# Test profile — uses the real PostgreSQL datasource (same as local dev defaults).
# @DataJpaTest with @ActiveProfiles("test") will pick this up.
# Each test class gets a transaction that rolls back automatically.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskoura}
spring.datasource.username=${DB_USERNAME:taskoura_user}
spring.datasource.password=${DB_PASSWORD:taskoura_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Stub AI config so GrokClient can be instantiated in integration test contexts
groq.api.key=test-key-stub
groq.api.url=http://localhost:9999/stub
groq.model=llama-3.3-70b-versatile


# Cloudinary stub config for tests
cloudinary.cloud-name=test_cloud
cloudinary.api-key=test_api_key
cloudinary.api-secret=test_api_secret

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Session Management & Timeouts
session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:30}
session.absolute-timeout-hours=${SESSION_ABSOLUTE_TIMEOUT_HOURS:12}
session.warning-seconds=${SESSION_WARNING_SECONDS:120}
session.touch-throttle-seconds=${SESSION_TOUCH_THROTTLE_SECONDS:30}

# OTP & Mail Test Properties
otp.pepper=EQtBDdAQjvZlm+MeX+xcGSjt8DaU+FQH5qFoooPeyzs=
otp.expiry-minutes=10
mail.from-address=support@taskoura.dev
mail.from-name=Taskoura
app.frontend-url=http://localhost:5173
app.name=Taskoura

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@taskoura.dev
spring.mail.password=secret
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000



