# Test profile — uses the real PostgreSQL datasource (same as local dev defaults).
# @DataJpaTest with @ActiveProfiles("test") will pick this up.
# Each test class gets a transaction that rolls back automatically.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskoura}
spring.datasource.username=${DB_USERNAME:taskoura_user}
spring.datasource.password=${DB_PASSWORD:taskoura_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Stub AI config so GrokClient can be instantiated in integration test contexts
grok.api.key=test-key-stub
grok.api.url=http://localhost:9999/stub
grok.model=grok-beta

# Cloudinary stub config for tests
cloudinary.cloud-name=test_cloud
cloudinary.api-key=test_api_key
cloudinary.api-secret=test_api_secret

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


