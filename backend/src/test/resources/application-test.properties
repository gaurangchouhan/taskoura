# Test profile — uses the real PostgreSQL datasource (same as local dev defaults).
# @DataJpaTest with @ActiveProfiles("test") will pick this up.
# Each test class gets a transaction that rolls back automatically.
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true

# Stub AI config so GrokClient can be instantiated in integration test contexts
groq.api.key=test-key-stub
groq.api.url=http://localhost:9999/stub
groq.model=llama-3.3-70b-versatile


# Cloudinary stub config for tests
cloudinary.cloud-name=test_cloud
cloudinary.api-key=test_api_key
cloudinary.api-secret=test_api_secret

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Session Management & Timeouts
session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:30}
session.absolute-timeout-hours=${SESSION_ABSOLUTE_TIMEOUT_HOURS:12}
session.warning-seconds=${SESSION_WARNING_SECONDS:120}
session.touch-throttle-seconds=${SESSION_TOUCH_THROTTLE_SECONDS:30}

# OTP & Mail Test Properties
otp.pepper=EQtBDdAQjvZlm+MeX+xcGSjt8DaU+FQH5qFoooPeyzs=
otp.expiry-minutes=10
mail.from-address=support@taskoura.dev
mail.from-name=Taskoura
app.frontend-url=http://localhost:5173
app.name=Taskoura

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@taskoura.dev
spring.mail.password=secret
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000

# BioLock Hardware Biometric Protection
biolock.enabled=${BIOLOCK_ENABLED:false}
biolock.device-master-key=${DEVICE_MASTER_KEY:}
biolock.request-ttl-seconds=${BIOLOCK_REQUEST_TTL_SECONDS:120}
biolock.access-ttl-minutes=${BIOLOCK_ACCESS_TTL_MINUTES:15}
biolock.job-lease-seconds=${BIOLOCK_JOB_LEASE_SECONDS:60}
biolock.device-online-seconds=${BIOLOCK_DEVICE_ONLINE_SECONDS:30}
biolock.max-requests-per-doc-per-hour=${BIOLOCK_MAX_REQUESTS_PER_DOC_PER_HOUR:5}
biolock.cleanup-grace-minutes=${BIOLOCK_CLEANUP_GRACE_MINUTES:0}
biolock.email-on-request=${BIOLOCK_EMAIL_ON_REQUEST:true}
biolock.email-throttle-minutes=${BIOLOCK_EMAIL_THROTTLE_MINUTES:5}
spring.mail.properties.mail.smtp.writetimeout=2000



