<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mention in Comment — Taskoura</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; }
    .wrapper { width: 100%; table-layout: fixed; background-color: #f8fafc; padding: 32px 16px; }
    .container { max-width: 580px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .header { padding: 28px 32px 20px; border-bottom: 1px solid #f1f5f9; }
    .brand { font-size: 22px; font-weight: 700; color: #0f172a; text-decoration: none; letter-spacing: -0.5px; }
    .brand span { color: #0284c7; }
    .body-content { padding: 32px; }
    h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0 0 16px; }
    p { font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 20px; }
    .quote-box { background-color: #f8fafc; border-left: 4px solid #6366f1; border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 24px 0; font-style: italic; color: #334155; line-height: 1.5; font-size: 14px; }
    .meta-info { font-size: 13px; color: #64748b; margin-top: 8px; font-style: normal; }
    .btn-container { text-align: center; margin: 32px 0 20px; }
    .btn { display: inline-block; background-color: #4f46e5; color: #ffffff !important; font-size: 15px; font-weight: 600; text-decoration: none; padding: 13px 28px; border-radius: 8px; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25); }
    .footer { padding: 24px 32px; background-color: #f8fafc; border-top: 1px solid #f1f5f9; text-align: center; font-size: 12px; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="container" role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td class="header">
          <a th:href="${frontendUrl}" class="brand">Task<span>oura</span></a>
        </td>
      </tr>
      <tr>
        <td class="body-content">
          <h1>New Mention in Comment</h1>
          <p>Hello <strong th:text="${recipientName}">there</strong>,</p>
          <p><strong th:text="${commenterName}">A teammate</strong> mentioned you in a comment on task <strong th:text="${taskTitle}">Task</strong> (<span th:text="${projectName}">Project</span>):</p>
          
          <div class="quote-box">
            &ldquo;<span th:text="${commentSnippet}">Comment content here</span>&rdquo;
            <div class="meta-info">— <span th:text="${commenterName}">Commenter</span></div>
          </div>

          <div class="btn-container">
            <a th:href="${taskUrl}" class="btn">View & Reply to Comment</a>
          </div>
        </td>
      </tr>
      <tr>
        <td class="footer">
          &copy; <span th:text="${currentYear}">2026</span> Taskoura. All rights reserved.<br>
          You received this email based on your Taskoura mention notification preferences.
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
