spring.application.name=backend

# Database (values come from environment variables; defaults are for local dev only)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskoura}
spring.datasource.username=${DB_USERNAME:taskoura_user}
spring.datasource.password=${DB_PASSWORD:taskoura_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:change-this-in-production-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Grok API
grok.api.key=${GROK_API_KEY}
grok.api.url=${GROK_API_URL}
grok.model=${GROK_MODEL:grok-beta}

# Email (Gmail SMTP — use an App Password, not your real Gmail password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

server.port=${PORT:8080}

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:test_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test_api_secret}

# Multipart configuration (allows up to 15MB at container level so service can cleanly reject >10MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

