spring.application.name=backend

# Database (values come from environment variables; defaults are for local dev only)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskoura}
spring.datasource.username=${DB_USERNAME:${DB_USER:taskoura_user}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:taskoura_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Optional local overrides (gitignored)
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:classpath:application-local.properties

# JWT
jwt.secret=${JWT_SECRET:EQtBDdAQjvZlm+MeX+xcGSjt8DaU+FQH5qFoooPeyzs=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Jackson
spring.jackson.time-zone=UTC

# Groq API (keys from https://console.groq.com/keys)
# Groq API — free-tier model
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Email (Gmail SMTP — use an App Password, not your real Gmail password)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Professional Mail Configuration
mail.from-address=${MAIL_FROM:${spring.mail.username:support@taskoura.dev}}
mail.from-name=${MAIL_FROM_NAME:Taskoura}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.name=${APP_NAME:Taskoura}

# Thymeleaf Template Engine
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
otp.pepper=${OTP_PEPPER:${jwt.secret}}

server.port=${SERVER_PORT:${PORT:8081}}

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart configuration (allows up to 15MB at container level so service can cleanly reject >10MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Session Management & Timeouts
session.idle-timeout-minutes=${SESSION_IDLE_TIMEOUT_MINUTES:60}
session.absolute-timeout-hours=${SESSION_ABSOLUTE_TIMEOUT_HOURS:1}
session.warning-seconds=${SESSION_WARNING_SECONDS:0}
session.touch-throttle-seconds=${SESSION_TOUCH_THROTTLE_SECONDS:30}

# OAuth / Third-Party Integrations (values injected via environment or application-local.properties)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
