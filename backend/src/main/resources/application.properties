spring.application.name=backend

# Database (values come from environment variables; defaults are for local dev only)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskoura
spring.datasource.username=${DB_USERNAME:taskoura_user}
spring.datasource.password=${DB_PASSWORD:taskoura_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Groq API (keys from https://console.groq.com/keys)
groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Email (Gmail SMTP — use an App Password, not your real Gmail password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:gaurangchouhan316@gmail.com}
spring.mail.password=${MAIL_PASSWORD:wimdynxjmhdlevio}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

server.port=${PORT:8080}

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:taskora}
cloudinary.api-key=${CLOUDINARY_API_KEY:799477719421434}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:JVtNYoh4jvA3CW1wmCe9x4xihpc}

# Multipart configuration (allows up to 15MB at container level so service can cleanly reject >10MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
